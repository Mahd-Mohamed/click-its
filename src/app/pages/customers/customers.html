<section class="bg-slate-50 py-12 sm:py-16">
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl lg:text-5xl">
        Customers
      </h1>
      <p class="mt-3 text-sm text-slate-500">
        <span class="text-red-500">*</span> The customers are displayed in alphabetical order
      </p>
    </div>

    @for (group of groups; track group.title) {
      <div class="mt-10">
        <h2 class="text-base font-semibold text-blue-400 sm:text-lg">
          {{ group.title }}
        </h2>
        <div class="mt-6 grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 sm:gap-6">
          @for (item of group.items; track item.name) {
            <div
              class="flex h-32 flex-col items-center justify-center overflow-hidden rounded-xl bg-white p-4 text-center shadow-sm ring-1 ring-slate-200 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg sm:h-36"
            >
              <img
                [src]="item.image"
                [alt]="item.name"
                class="max-h-20 w-auto object-contain"
                loading="lazy"
              />
              <p class="mt-3 line-clamp-2 text-xs font-medium text-slate-700">
                {{ item.name }}
              </p>
            </div>
          }
        </div>
      </div>
    }
  </div>
</section>
