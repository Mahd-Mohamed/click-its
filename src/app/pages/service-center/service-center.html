<section class="flex min-h-[calc(100vh-80px)] flex-col justify-center bg-slate-50 py-8 sm:py-10">
  <div class="mx-auto flex w-full max-w-7xl flex-1 flex-col px-4 sm:px-6 lg:px-8">
    <h1
      class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl lg:text-5xl"
    >
      Service Center
    </h1>

    <div
      class="mt-10 grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 sm:gap-6"
    >
      @for (image of images; track image) {
        <div
          class="flex h-40 w-full items-center justify-center overflow-hidden rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-slate-900/10 sm:h-48 md:h-56 lg:h-64 xl:h-72"
        >
          <img
            [src]="image"
            alt="Service partner"
            class="max-h-full max-w-full object-contain"
            loading="lazy"
          />
        </div>
      }
    </div>
  </div>
</section>
