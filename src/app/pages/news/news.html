<section class="bg-slate-50 pt-10 pb-16 sm:pt-16 sm:pb-24">
  <div class="mx-auto w-full max-w-5xl px-4 sm:px-6 lg:px-8">
    <div>
      <h1
        class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl lg:text-5xl"
      >
        News
      </h1>
    </div>

    <div class="mt-8">
      @for (item of items; track item.title; let last = $last) {
        <div
          class="flex flex-col gap-6 py-8 sm:flex-row sm:items-start sm:gap-8"
          [class.border-b]="!last"
          [class.border-slate-200]="!last"
        >
          <div
            class="relative aspect-[4/3] w-full shrink-0 overflow-hidden rounded-2xl sm:aspect-auto sm:w-56 md:w-64"
          >
            <img
              [src]="item.image"
              [alt]="item.title"
              class="h-full w-full object-cover"
              loading="lazy"
            />
          </div>

          <div class="flex-1">
            <div class="flex flex-wrap items-center gap-3">
              <span
                class="rounded-full bg-blue-600 px-3 py-1 text-xs font-semibold text-white shadow-sm"
              >
                {{ item.category }}
              </span>
              <div class="flex items-center gap-2 text-sm text-slate-500">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="h-4 w-4"
                  aria-hidden="true"
                >
                  <rect x="3" y="4" width="18" height="18" rx="2" />
                  <path d="M16 2v4M8 2v4M3 10h18" />
                </svg>
                {{ item.date }}
              </div>
            </div>

            <h2
              class="mt-3 text-xl font-bold text-slate-900 transition-colors hover:text-blue-600"
            >
              {{ item.title }}
            </h2>

            <p class="mt-3 text-sm leading-relaxed text-slate-600">
              {{ item.content }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
