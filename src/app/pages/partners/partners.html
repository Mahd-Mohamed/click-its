<section class="bg-slate-50 py-12 sm:py-16">
  <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <h1 class="text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl lg:text-5xl">
      Partners
    </h1>

    <div class="mt-10 grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 sm:gap-6">
      @for (logo of partners; track logo) {
        <div
          class="flex h-28 items-center justify-center overflow-hidden rounded-xl bg-white p-4 shadow-sm ring-1 ring-slate-200 transition-all duration-300 hover:-translate-y-1 hover:shadow-lg sm:h-32 md:h-36"
        >
          <img
            [src]="logo"
            alt="Partner logo"
            class="max-h-full max-w-full object-contain"
            loading="lazy"
          />
        </div>
      }
    </div>
  </div>
</section>
